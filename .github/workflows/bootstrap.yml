name: Bootstrap Resolution Master Lite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lite source from upstream
        shell: bash
        run: |
          set -euxo pipefail
          cp .bootstrap/lite.patch.gz.b64 /tmp/lite.patch.gz.b64
          git clone --depth 1 https://github.com/Azornes/Comfyui-Resolution-Master.git /tmp/upstream
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='tests' /tmp/upstream/ ./
          rm -rf .github .bootstrap tests __pycache__
          rm -f .tracking CLONE.md RESOLUTIONMASTER.md
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          base64 -d /tmp/lite.patch.gz.b64 | gunzip > /tmp/lite.patch
          patch -p1 < /tmp/lite.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Resolution Master Lite source [bootstrap-done]"
          git push
