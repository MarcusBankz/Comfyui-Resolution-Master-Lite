name: Bootstrap Resolution Master Lite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-base-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original Resolution Master source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Azornes/Comfyui-Resolution-Master.git /tmp/upstream
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.bootstrap' \
            --exclude='tests' \
            /tmp/upstream/ ./
          rm -rf tests __pycache__
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f .tracking CLONE.md RESOLUTIONMASTER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap original Resolution Master source [bootstrap-base-done]"
          git push
