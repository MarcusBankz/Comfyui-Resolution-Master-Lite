[project]
name = "Comfyui-Resolution-Master-Lite"
description = "A compact preset-focused edit of Comfyui-Resolution-Master for ComfyUI."
version = "2.0.0"
license = { text = "MIT License" }

[project.urls]
Repository = "https://github.com/MarcusBankz/Comfyui-Resolution-Master-Lite"

[tool.comfy]
PublisherId = "MarcusBankz"
DisplayName = "Comfyui-Resolution-Master-Lite"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=tests"
asyncio_default_fixture_loop_scope = "function"
